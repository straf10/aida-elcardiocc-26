[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elcardio"
version = "0.0.0"
description = "ELCardioCC — BioASQ/CLEF multi-label ICD-10 classification"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
