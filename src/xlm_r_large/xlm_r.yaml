# Seed-42 predict/serve config (reuses existing trained checkpoint/artifacts).
# Hyperparameters intentionally mirror xlm_r.yaml; only output/W&B paths are isolated.

model:
  name: xlm-roberta-large
  num_labels: 115

data:
  train_path: data/processed/train.jsonl
  val_path: data/processed/val.jsonl
  test_path: data/processed/test.jsonl
  blind_path: data/raw/blind_test.jsonl
  labelset_path: data/raw/labelset.txt
  max_length: 512
  sliding_window: true
  stride: 256
  chunk_strategy: random
  chunk_aggregation: mean_max
  chunk_aggregation_alpha: 0.5
  truncation_side: right

training:
  epochs: 40
  batch_size: 2
  eval_batch_size: 16
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-05
  weight_decay: 0.05
  warmup_ratio: 0.06
  eval_threshold: 0.5
  eval_thresholds: [0.5]
  fp16: true
  seed: 42
  loss: zlpr
  asl_gamma_neg: 4.0
  asl_gamma_pos: 1.0
  asl_clip: 0.05
  pos_weight_cap: 20.0
  max_grad_norm: 1.0
  freeze_layers: 0
  classifier_dropout: 0.15
  early_stopping_patience: 5
  auto_threshold_tuning: false
  gradient_checkpointing: false
  compile_model: false
  num_workers: 4
  pin_memory: true

output:
  checkpoint_dir: outputs/models/xlm_r_large
  scores_path: outputs/models/xlm_r_large/val_scores.npy
  patient_ids_path: outputs/models/xlm_r_large/val_patient_ids.json
  label_names_path: outputs/models/xlm_r_large/label_names.json
  thresholds_path: outputs/models/xlm_r_large/thresholds.json
  test_scores_path: outputs/models/xlm_r_large/test_scores.npy
  blind_scores_path: outputs/models/xlm_r_large/blind_scores.npy
  val_predictions_path: outputs/predictions/xlm_r_large/val_predictions.jsonl
  test_predictions_path: outputs/predictions/xlm_r_large/test_predictions.jsonl
  blind_predictions_path: outputs/predictions/xlm_r_large/blind_predictions.jsonl
  log_dir: outputs/models/xlm_r_large/logs

threshold_tuning:
  min: 0.05
  max: 0.95
  step: 0.01

wandb:
  enabled: true
  log_model_artifact: false
  project: elcardiocc-2026
  entity: elcardiocc26
  run_name: null
  run_id_style: random
  run_counter_path: outputs/models/xlm_r_large/wandb_run_counter.txt
  notes: "Seed 42 config for inference/ensemble with isolated artifact paths"
  tags:
    - xlm-r-large
    - mlc
    - zlpr
    - mean-max
    - seed-42
  save_code: false
  disable_upload: true
