# Track B: random chunk strategy baseline (30-epoch comparison)
model:
  name: "xlm-roberta-large"
  num_labels: 115

data:
  train_path: "data/processed/training_set.jsonl"
  val_path: "data/processed/validation_set.jsonl"
  labelset_path: "data/raw/Train_Set_2026/labelset.txt"
  frequencies_path: "data/processed/icd10_frequencies.json"
  max_length: 512
  sliding_window: true
  stride: 256
  chunk_strategy: "random"
  truncation_side: "right"

training:
  epochs: 30
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  weight_decay: 0.05
  warmup_ratio: 0.10
  scheduler: "cosine"
  eta_min_ratio: 0.10
  eval_threshold: 0.50
  eval_thresholds: [0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7]
  fp16: true
  seed: 42
  loss: "asl"
  focal_gamma: 3.0
  asl_gamma_neg: 4.0
  asl_gamma_pos: 1.0
  asl_clip: 0.05
  group_asl_temperature: 1.0
  max_grad_norm: 1.0
  llrd_embedding_multiplier: 0.5
  llrd_head_multiplier: 2.0
  llrd_middle_multiplier: 0.8
  label_smoothing: 0.0
  freeze_layers: 8
  classifier_dropout: 0.3
  pooling_strategy: "cls"
  multi_sample_dropout_samples: 5
  aggregation_strategy: "max"
  aggregation_temperature: 1.0
  swa_start_epoch: 20
  swa_save_if_best: true
  auto_threshold_tuning: true
  early_stopping_patience: 7
  init_classifier_from_descriptions: false
  use_desc_residual: false
  desc_residual_alpha_init: 0.1
  rebake_desc_after_swa: false
  desc_init_scale: 0.02

output:
  checkpoint_dir: "outputs/experiments/xlm_r_large/track_b_random_30e/checkpoints"
  scores_path: "outputs/experiments/xlm_r_large/track_b_random_30e/val_scores.npy"
  patient_ids_path: "outputs/experiments/xlm_r_large/track_b_random_30e/val_patient_ids.json"
  label_names_path: "outputs/experiments/xlm_r_large/track_b_random_30e/label_names.json"
  thresholds_path: "outputs/experiments/xlm_r_large/track_b_random_30e/thresholds.json"
  per_class_report_path: "outputs/experiments/xlm_r_large/track_b_random_30e/per_class_report.csv"
  error_analysis_path: "outputs/experiments/xlm_r_large/track_b_random_30e/error_analysis.json"
  log_dir: "outputs/experiments/xlm_r_large/track_b_random_30e/logs"

threshold_tuning:
  min: 0.05
  max: 0.95
  step: 0.01

wandb:
  enabled: false
  project: "elcardiocc-2026"
  entity: "elcardiocc26"
  run_name: null
  notes: "Track B: random chunk strategy baseline (30-epoch comparison)"
  tags: ["xlm-r-large", "track-b", "random-30e"]
