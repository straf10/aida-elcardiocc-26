# ASL control config for loss ablation against ZLPR+mean_max.
# This file mirrors the prior xlm_r.yaml baseline hyperparameters and only changes:
#   - training.loss: asl
#   - training.eval_thresholds: small sweep around 0.5 for ASL ceiling visibility
#   - output/wandb paths for artifact isolation

model:
  name: xlm-roberta-large
  num_labels: 115

data:
  train_path: data/processed/train.jsonl
  val_path: data/processed/val.jsonl
  test_path: data/processed/test.jsonl
  labelset_path: data/raw/labelset.txt
  max_length: 512
  sliding_window: true
  stride: 256
  chunk_strategy: random
  chunk_aggregation: mean_max
  chunk_aggregation_alpha: 0.5
  truncation_side: right

training:
  epochs: 30
  batch_size: 2
  eval_batch_size: 16
  gradient_accumulation_steps: 16   # effective_batch_size = batch_size * grad_accum = 32
  learning_rate: 1.0e-05
  weight_decay: 0.05
  warmup_ratio: 0.1
  eval_threshold: 0.5
  eval_thresholds: [0.3, 0.35, 0.4, 0.45, 0.5, 0.55]
  fp16: true
  seed: 42
  loss: asl
  asl_gamma_neg: 4.0
  asl_gamma_pos: 1.0
  asl_clip: 0.05
  pos_weight_cap: 20.0
  max_grad_norm: 1.0
  freeze_layers: 4
  classifier_dropout: 0.3
  early_stopping_patience: 7
  auto_threshold_tuning: false
  gradient_checkpointing: false
  compile_model: false
  # On Windows, benchmark num_workers: 0 vs 2 vs 4 (spawned workers clone the full pre-tokenized
  # dataset in RAM; often 0 or 2 is faster than 4). Default 4 kept for parity.
  num_workers: 4
  pin_memory: true

output:
  checkpoint_dir: outputs/models/xlm_r_large_asl_ctrl
  scores_path: outputs/models/xlm_r_large_asl_ctrl/val_scores.npy
  patient_ids_path: outputs/models/xlm_r_large_asl_ctrl/val_patient_ids.json
  label_names_path: outputs/models/xlm_r_large_asl_ctrl/label_names.json
  thresholds_path: outputs/models/xlm_r_large_asl_ctrl/thresholds.json
  val_predictions_path: outputs/predictions/xlm_r_large_asl_ctrl/val_predictions.jsonl
  log_dir: outputs/models/xlm_r_large_asl_ctrl/logs

threshold_tuning:
  min: 0.05
  max: 0.95
  step: 0.01

wandb:
  enabled: true
  log_model_artifact: false
  project: elcardiocc-2026
  entity: elcardiocc26
  run_name: null
  run_id_style: random
  run_counter_path: outputs/models/xlm_r_large_asl_ctrl/wandb_run_counter.txt
  notes: "XLM-R large ASL+mean-max control (same hparams as baseline snapshot, loss switched back to ASL)"
  tags:
    - xlm-r-large
    - mlc
    - asl
    - mean-max
    - control
  save_code: false
  disable_upload: true
