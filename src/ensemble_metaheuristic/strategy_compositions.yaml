# Declarative label-set fusion: each entry combines **existing base** exports by slug.
# Ops: union (OR per label), intersection (AND per label), k_of_n (need k and exactly that many inputs).
# Base slugs are produced by ``python -m ensemble_metaheuristic`` (see ``strategy_bases`` / export).
# Edit this file to try new merges without adding Python strategy modules.

compositions:
  - slug: merge_or_per_label_weighted
    op: union
    inputs: [per_label_routing, weighted]

  - slug: merge_or_per_label_vote_weighted
    op: union
    inputs: [per_label_champion_plus_vote, weighted]

  - slug: merge_and_weighted_correction
    op: intersection
    inputs: [weighted, correction]

  - slug: merge_k2_weighted_per_label_correction
    op: k_of_n
    k: 2
    inputs: [weighted, per_label_routing, correction]
