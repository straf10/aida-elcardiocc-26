data:
  val_path: "data/processed/validation_set.jsonl"

clustering:
  model_name: "nlpaueb/bert-base-greek-uncased-v1"
  n_clusters: 8
  max_length: 256
  batch_size: 16
  # Global clustering only (UMAP, k-means assignments) — keeps analysis/ root uncluttered
  dir: "outputs/analysis/clustering"
  embeddings_cache: "outputs/analysis/clustering/embeddings.npy"

models:
  - name: xlm_r_large
    type: scores
    paths:
      scores_path: models/xlm_large/val_scores.npy
      pids_path: models/xlm_large/val_patient_ids.json
      label_names_path: models/xlm_large/label_names.json
      thresholds_path: models/xlm_large/thresholds.json

  - name: mlc_greek_bert
    type: scores
    paths:
      scores_path: models/greek_bert/val_scores.npy
      pids_path: models/greek_bert/val_pids.json
      label_names_path: models/greek_bert/labels.json
      thresholds_path: models/greek_bert/thresholds.json

  - name: xlm_r_base
    type: scores
    train_config: src/xlm_r_base/xlm_r_base.yaml
    paths:
      scores_path: models/xlm_base/val_scores.npy
      pids_path: models/xlm_base/val_patient_ids.json
      label_names_path: models/xlm_base/label_names.json
      thresholds_path: models/xlm_base/avg_thresholds.npy
    predict_module: src.xlm_r_base.predict
    predict_args: ["--split", "val", "--fold", "4",
                   "--scores-out", "models/xlm_base/val_scores.npy",
                   "--pids-out", "models/xlm_base/val_patient_ids.json",
                   "--labels-out", "models/xlm_base/label_names.json"]

  - name: information_retrieval
    type: predictions_only
    predictions_path: models/ir/predictions.jsonl
    labelset_path: data/raw/Train_Set_2026/labelset.txt
    predict_module: src.information_retrieval
    predict_args: ["--retriever", "hybrid",
                   "--write-predictions", "models/ir/predictions.jsonl"]

  - name: ner_el
    type: predictions_only
    predictions_path: models/ner/predictions.jsonl
    labelset_path: data/raw/Train_Set_2026/labelset.txt
    predict_module: src.ner_el.predict
    predict_args:
      - "--model-dir"
      - "models/ner"
      - "--tokenizer-name"
      - "nlpaueb/bert-base-greek-uncased-v1"
      - "--input-path"
      - "data/processed/validation_set.jsonl"
      - "--output-doc-path"
      - "models/ner/predictions.jsonl"
      - "--output-debug-path"
      - "outputs/experiments/ner_el/val_debug.jsonl"

long_tail:
  frequent_min_support: 50
  rare_max_support: 10

top_k: [3, 5, 10]
top_n_confused_pairs: 10
top_n_heatmap_codes: 20

keywords:
  - "ιστορικό"
  - "διάγνωση"
  - "υπέρταση"
  - "στεφανιαία"
  - "έμφραγμα"
  - "αρρυθμία"

length_split: "median"

output:
  dir: "outputs/analysis"
