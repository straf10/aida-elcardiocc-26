model:
  name: "xlm-roberta-base"

data:
  val_path: "data/processed/val.jsonl"
  test_path: "data/processed/test.jsonl"
  labelset_path: "data/raw/labelset.txt"
  desc_csv: "data/external/icd10_greek_lookup.csv"
  max_length: 512

training:
  batch_size: 16

threshold_tuning:
  min: 0.05
  max: 0.95
  step: 0.01

output:
  checkpoint_dir: "outputs/models/xlm_base"
  scores_path: "outputs/models/xlm_base/val_scores.npy"
  patient_ids_path: "outputs/models/xlm_base/val_patient_ids.json"
  label_names_path: "outputs/models/xlm_base/label_names.json"
  thresholds_path: "outputs/models/xlm_base/thresholds.json"
