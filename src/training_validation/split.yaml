# One-shot split of the full 2500-record release. The original `train_dataset.jsonl` is removed after a successful run.
# To re-run: `git checkout -- data/raw/Train_Set_2026/train_dataset.jsonl` (or restore the full JSONL) and set raw_path below.

data:
  raw_path: "data/raw/Train_Set_2026/train_dataset.jsonl"

output:
  train_path: "data/raw/Train_Set_2026/train.jsonl"
  val_path: "data/raw/Train_Set_2026/val.jsonl"
  test_path: "data/raw/Train_Set_2026/test.jsonl"
  delete_original: true
  split_report_path: "data/raw/Train_Set_2026/split_report.json"

split:
  val_size: 0.1
  test_size: 0.2
  seed: 42
