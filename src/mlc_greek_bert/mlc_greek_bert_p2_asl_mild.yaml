# ELCardioCC 2026 — Greek-BERT MLC — Phase 3 run R2 (milder ASL)
# Calibration probe with milder ASL and architecture defaults for clean ablation.

model:
  name: "nlpaueb/bert-base-greek-uncased-v1"
  num_labels: 115
  dropout: 0.2
  max_length: 256
  pooling: "cls"
  head: "linear"

training:
  epochs: 30
  batch_size: 16
  grad_accum_steps: 2
  num_workers: 4
  learning_rate: 2.0e-5
  llrd: null
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 42

  loss: "asl"
  use_class_weights: false
  pos_weight_cap: 8.0
  asl_gamma_neg: 2.0
  asl_gamma_pos: 0.0
  asl_clip: 0.05

  eval_threshold: 0.5
  eval_thresholds: [0.4, 0.45, 0.5, 0.55, 0.6]
  eval_batch_multiplier: 4

  early_stopping_patience: 7

  fp16: true
  pin_memory: true
  compile_model: false
  gradient_checkpointing: false

data:
  train_path: "data/processed/train.jsonl"
  val_path: "data/processed/val.jsonl"
  test_path: "data/processed/test.jsonl"

output:
  checkpoint_dir: "outputs/models/mlc_greek_bert/p2_asl_mild"
  scores_path: "outputs/models/mlc_greek_bert/p2_asl_mild/val_scores.npy"
  pids_path: "outputs/models/mlc_greek_bert/p2_asl_mild/val_pids.json"
  labels_path: "outputs/models/mlc_greek_bert/p2_asl_mild/labels.json"
  thresholds_path: "outputs/models/mlc_greek_bert/p2_asl_mild/best_thresholds.json"

threshold_tuning:
  enabled: true
  min: 0.35
  max: 0.65
  step: 0.01
  passes: 1
  min_pos_count: 10
  min_class_gain: 0.0005

wandb:
  project: "elcardiocc-2026"
  run_name: "greek-bert-p3-asl-mild"
  tags: ["mlc", "greek-bert", "phase3", "p3-asl-mild", "loss-asl", "asl-milder"]
  primary_report_metric: "val_tuned_micro_f1"

sweep:
  config_path: "src/mlc_greek_bert/sweep_config.yaml"
  sweep_epochs: 10
