# ELCardioCC 2026 — Greek-BERT MLC Training Config
# Owner: Vasiliki
# Edit this file to run experiments — NEVER hardcode hyperparameters in training scripts.

model:
  name: "nlpaueb/bert-base-greek-uncased-v1"
  num_labels: 115
  dropout: 0.2
  max_length: 256

training:
  epochs: 20
  batch_size: 16
  grad_accum_steps: 2
  num_workers: 4
  learning_rate: 2.0e-5
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 42

  loss: "bce_pos_weight"   # "bce_pos_weight" | "asl"
  use_class_weights: true
  pos_weight_cap: 8.0
  asl_gamma_neg: 4.0
  asl_gamma_pos: 1.0
  asl_clip: 0.05

  eval_threshold: 0.55
  eval_thresholds: [0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6]
  eval_batch_multiplier: 4

  early_stopping_patience: 5

  fp16: true
  pin_memory: true
  compile_model: false
  gradient_checkpointing: false

data:
  train_path: "data/processed/train.jsonl"
  val_path: "data/processed/val.jsonl"
  test_path: "data/processed/test.jsonl"
 # labels_path: "data/processed/labels.json"


output:
  checkpoint_dir: "outputs/models/mlc_greek_bert"
  scores_path: "outputs/models/mlc_greek_bert/val_scores.npy"
  pids_path: "outputs/models/mlc_greek_bert/val_pids.json"
  labels_path: "outputs/models/mlc_greek_bert/labels.json"
  thresholds_path: "outputs/models/mlc_greek_bert/best_thresholds.json"

# Post-train: per-class thresholds on val split (group-level micro-F1).
threshold_tuning:
  enabled: true
  min: 0.35
  max: 0.65
  step: 0.01
  passes: 1

wandb:
  project: "elcardiocc-2026"
  run_name: "greek-bert-mlc-phase1"
  tags: ["mlc", "greek-bert", "vasiliki", "phase1"]


sweep:
  config_path: "src/mlc_greek_bert/sweep_config.yaml"
  sweep_epochs: 10
