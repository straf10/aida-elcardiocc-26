# ELCardioCC 2026 — Greek-BERT MLC Training Config (All-data boost run)
# Owner: Vasiliki
# Trains on full labeled data and saves only final model.

model:
  name: "nlpaueb/bert-base-greek-uncased-v1"
  num_labels: 115
  dropout: 0.2
  max_length: 256

training:
  epochs: 20
  batch_size: 16
  grad_accum_steps: 2
  num_workers: 4
  learning_rate: 2.0e-5
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 42
  save_last_only: true

  loss: "bce_pos_weight"
  use_class_weights: true
  pos_weight_cap: 20.0
  asl_gamma_neg: 4.0
  asl_gamma_pos: 1.0
  asl_clip: 0.05

  eval_threshold: 0.5
  eval_thresholds: [0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6]

  early_stopping_patience: 0

  fp16: true
  pin_memory: true

data:
  train_path: "data/processed/all_data.jsonl"

output:
  checkpoint_dir: "outputs/models/mlc_greek_bert/all_data_artifacts"
  scores_path: "outputs/models/mlc_greek_bert/all_data_artifacts/val_scores.npy"
  pids_path: "outputs/models/mlc_greek_bert/all_data_artifacts/val_pids.json"
  labels_path: "outputs/models/mlc_greek_bert/all_data_artifacts/labels.json"
  thresholds_path: "outputs/models/mlc_greek_bert/all_data_artifacts/best_thresholds.json"

wandb:
  project: "elcardiocc-2026"
  run_name: "greek-bert-mlc-all-data-boost"
  tags: ["mlc", "greek-bert", "vasiliki", "all-data", "submission-boost", "phase1"]

sweep:
  config_path: "src/mlc_greek_bert/sweep_config.yaml"
  sweep_epochs: 10
