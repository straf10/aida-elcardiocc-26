# Multilabel stratified 3-way split of the full committee JSONL into data/raw/.
# After this, run preprocessing so models use ``data/processed/``:
#   PYTHONPATH=src python -m split_data --config src/split_data/split.yaml
#   PYTHONPATH=src python -m preprocessing
#
# Restore ``data/raw/train_dataset.jsonl`` (full pool) before re-running the first step.

data:
  raw_path: "data/raw/train_dataset.jsonl"

output:
  train_path: "data/raw/train.jsonl"
  val_path: "data/raw/val.jsonl"
  test_path: "data/raw/test.jsonl"
  delete_original: true
  split_report_path: "data/raw/split_report.json"

split:
  val_size: 0.1
  test_size: 0.1
  seed: 42
