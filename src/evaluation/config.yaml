# Single evaluation config: multi-model compare (``models``), data paths,
# threshold tuning inputs, and legacy single-system paths. Compare uses ``data.test_path`` gold by default.

data:
  val_path: "data/processed/val.jsonl"
  train_path: "data/processed/train.jsonl"
  # Default gold for ``compare`` / ``compare_methods`` (same split as ``run_predictions`` test JSONL).
  test_path: "data/processed/test.jsonl"
  # Submission blind set (for ``ensemble_metaheuristic`` export / ``compare_methods --splits blind``).
  blind_path: "data/raw/blind_test.jsonl"

# Compare / ensemble: labeled **test** predictions per method (``test_predictions.jsonl``).
# Ensemble scores **val** gold: use ``val_predictions.jsonl`` in the same folder (see ``model_artifacts``).
# ``use_in_ensemble: false`` keeps a row for ``compare_methods`` but skips it in ``python -m ensemble_metaheuristic``.
models:
  - name: xlm_r_large
    use_in_ensemble: false
    predictions_path: outputs/predictions/xlm_r_large/test_predictions.jsonl
    labelset_path: data/raw/labelset.txt
    thresholds_path: outputs/models/xlm_r_large/thresholds.json
    scores_path: outputs/models/xlm_r_large/val_scores.npy
    pids_path: outputs/models/xlm_r_large/val_patient_ids.json
    label_names_path: outputs/models/xlm_r_large/label_names.json

  - name: mlc_greek_bert
    predictions_path: outputs/predictions/mlc_greek_bert/test_predictions.jsonl
    labelset_path: data/raw/labelset.txt
    thresholds_path: outputs/models/mlc_greek_bert/best_thresholds.json
    scores_path: outputs/models/mlc_greek_bert/val_scores.npy
    pids_path: outputs/models/mlc_greek_bert/val_pids.json
    label_names_path: outputs/models/mlc_greek_bert/labels.json

  - name: xlm_r_base
    predictions_path: outputs/predictions/xlm_r_base/test_predictions.jsonl
    labelset_path: data/raw/labelset.txt

  - name: information_retrieval
    predictions_path: outputs/predictions/information_retrieval/test_predictions.jsonl
    labelset_path: data/raw/labelset.txt

  - name: dictionary_baseline
    predictions_path: outputs/predictions/dictionary_baseline/test_predictions.jsonl
    labelset_path: data/raw/labelset.txt

  - name: ner_el
    predictions_path: outputs/predictions/ner_el/test_predictions.jsonl
    labelset_path: data/raw/labelset.txt

  # Written by ``python -m ensemble_metaheuristic`` (default: ``weighted/`` subfolder).
  - name: ensemble_metaheuristic
    predictions_path: outputs/predictions/ensemble_metaheuristic/weighted/test_predictions.jsonl
    labelset_path: data/raw/labelset.txt

  # Written by ``python -m ensemble_stacking`` (best slug chosen automatically).
  # Update the slug below to match the best result from the stacking run, e.g.
  # ``logistic_regression_per_label`` or ``pytorch_mlp_global``.
  - name: ensemble_stacking
    predictions_path: outputs/predictions/ensemble_stacking/logistic_regression_per_label/test_predictions.jsonl
    labelset_path: data/raw/labelset.txt

  # Committee grid MLP (``PYTHONPATH=src python -m ensemble_committee_mlp``). Uncomment and set
  # ``predictions_path`` to the slug folder written under ``outputs/predictions/ensemble_committee_mlp/``.
  # - name: ensemble_committee_mlp
  #   predictions_path: outputs/predictions/ensemble_committee_mlp/committee_flatten_per_label/test_predictions.jsonl
  #   labelset_path: data/raw/labelset.txt

output:
  dir: "outputs/models/evaluation"
  thresholds_path: "outputs/models/evaluation/thresholds.json"
  per_class_report_path: "outputs/models/evaluation/per_class_report.csv"

# Defaults for ``python -m evaluation.evaluator score`` and ``threshold_tune.py``.
ground_truth_path: "data/processed/val.jsonl"
prediction_path: "predictions/system.jsonl"
predictions_dir: "predictions/"
scores_path: "outputs/models/evaluation/val_scores.npy"
patient_ids_path: "outputs/models/evaluation/val_patient_ids.json"
label_names_path: "outputs/models/evaluation/label_names.json"

threshold_tuning:
  min: 0.05
  max: 0.95
  step: 0.01
  passes: 1
