# Single evaluation config: multi-model compare (``models``), data paths,
# threshold tuning inputs, and legacy single-system paths. Compare uses ``data.test_path`` gold by default.

data:
  val_path: "data/processed/val.jsonl"
  train_path: "data/processed/train.jsonl"
  # Default gold for ``compare`` / ``compare_methods`` (same split as ``run_predictions`` test JSONL).
  test_path: "data/processed/test.jsonl"

# Compare / ensemble: predictions JSONL per method (optional score bundles per model).
models:
  - name: xlm_r_large
    predictions_path: outputs/predictions/xlm_r_large/predictions.jsonl
    labelset_path: data/raw/labelset.txt
    thresholds_path: outputs/models/xlm_r_large/thresholds.json
    scores_path: outputs/models/xlm_r_large/val_scores.npy
    pids_path: outputs/models/xlm_r_large/val_patient_ids.json
    label_names_path: outputs/models/xlm_r_large/label_names.json

  - name: mlc_greek_bert
    predictions_path: outputs/predictions/mlc_greek_bert/predictions.jsonl
    labelset_path: data/raw/labelset.txt
    thresholds_path: outputs/models/mlc_greek_bert/best_thresholds.json
    scores_path: outputs/models/mlc_greek_bert/val_scores.npy
    pids_path: outputs/models/mlc_greek_bert/val_pids.json
    label_names_path: outputs/models/mlc_greek_bert/labels.json

  - name: xlm_r_base
    predictions_path: outputs/predictions/xlm_r_base/predictions.jsonl
    labelset_path: data/raw/labelset.txt

  - name: information_retrieval
    predictions_path: outputs/predictions/information_retrieval/predictions.jsonl
    labelset_path: data/raw/labelset.txt

  - name: ner_el
    predictions_path: outputs/predictions/ner_el/predictions.jsonl
    labelset_path: data/raw/labelset.txt

output:
  dir: "outputs/models/evaluation"
  thresholds_path: "outputs/models/evaluation/thresholds.json"
  per_class_report_path: "outputs/models/evaluation/per_class_report.csv"

# Defaults for ``python -m evaluation.evaluator score`` and ``threshold_tune.py``.
ground_truth_path: "data/processed/val.jsonl"
prediction_path: "predictions/system.jsonl"
predictions_dir: "predictions/"
scores_path: "outputs/models/evaluation/val_scores.npy"
patient_ids_path: "outputs/models/evaluation/val_patient_ids.json"
label_names_path: "outputs/models/evaluation/label_names.json"

threshold_tuning:
  min: 0.05
  max: 0.95
  step: 0.01
  passes: 1
