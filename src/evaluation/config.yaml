# Single evaluation config: multi-model compare (``models``), val/train paths,
# threshold tuning inputs, submission validation, and legacy single-system paths.

data:
  val_path: "data/processed/val.jsonl"
  train_path: "data/processed/train.jsonl"

# Compare / ensemble: predictions JSONL per method (optional score bundles per model).
models:
  - name: xlm_r_large
    predictions_path: outputs/predictions/xlm_r_large/predictions.jsonl
    labelset_path: data/raw/labelset.txt
    thresholds_path: outputs/models/xlm_large/thresholds.json
    scores_path: outputs/models/xlm_large/val_scores.npy
    pids_path: outputs/models/xlm_large/val_patient_ids.json
    label_names_path: outputs/models/xlm_large/label_names.json

  - name: mlc_greek_bert
    predictions_path: outputs/predictions/mlc_greek_bert/predictions.jsonl
    labelset_path: data/raw/labelset.txt
    thresholds_path: outputs/models/greek_bert/best_thresholds.json
    scores_path: outputs/models/greek_bert/val_scores.npy
    pids_path: outputs/models/greek_bert/val_pids.json
    label_names_path: outputs/models/greek_bert/labels.json

  - name: xlm_r_base
    predictions_path: outputs/predictions/xlm_r_base/predictions.jsonl
    labelset_path: data/raw/labelset.txt

  - name: information_retrieval
    predictions_path: outputs/predictions/information_retrieval/predictions.jsonl
    labelset_path: data/raw/labelset.txt

  - name: ner_el
    predictions_path: outputs/predictions/ner_el/predictions.jsonl
    labelset_path: data/raw/labelset.txt

output:
  dir: "outputs/evaluation"
  thresholds_path: "outputs/experiments/evaluation/thresholds.json"
  per_class_report_path: "outputs/experiments/evaluation/per_class_report.csv"

# Defaults for ``python -m evaluation.evaluator score`` and ``threshold_tune.py``.
ground_truth_path: "data/processed/val.jsonl"
prediction_path: "predictions/system.jsonl"
predictions_dir: "predictions/"
scores_path: "outputs/experiments/evaluation/val_scores.npy"
patient_ids_path: "outputs/experiments/evaluation/val_patient_ids.json"
label_names_path: "outputs/experiments/evaluation/label_names.json"

threshold_tuning:
  min: 0.05
  max: 0.95
  step: 0.01
  passes: 1

submission:
  zip_path: "submissions/our_team.zip"
  test_jsonl: "data/raw/blind_test.jsonl"
  labelset_path: "data/raw/labelset.txt"
  max_systems: 5
  strict_codes: false
  require_singleton_groups: false
