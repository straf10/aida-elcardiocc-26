model:
  name: "xlm-roberta-base" # Set to "xlm-roberta-large" for the larger model
  num_labels: 115

data:
  train_path: "data/processed/training_set.jsonl"
  val_path: "data/processed/validation_set.jsonl"
  labelset_path: "data/raw/Train_Set_2026/labelset.txt"
  frequencies_path: "data/processed/icd10_frequencies.json"
  max_length: 512
  sliding_window: true  # toggle for long-doc experiments
  stride: 256
  chunk_strategy: "all" # Options: "random", "all"

training:
  epochs: 15
  batch_size: 8
  gradient_accumulation_steps: 4  # effective batch = 32
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.10
  scheduler: "cosine"
  eval_threshold: 0.30
  fp16: true
  seed: 42
  loss: "focal"  # options: bce, bce_weighted, focal
  focal_gamma: 1.0  # optimized from 2.0
  max_grad_norm: 1.0
  llrd_embedding_multiplier: 0.5 # Gentler LLRD multiplier
  llrd_head_multiplier: 2.0
  llrd_middle_multiplier: 0.8
  label_smoothing: 0.1 # Helps with overconfidence
  early_stopping_patience: 3

output:
  checkpoint_dir: "outputs/xlm_r/checkpoints"
  scores_path: "outputs/xlm_r/val_scores.npy"
  patient_ids_path: "outputs/xlm_r/val_patient_ids.json"
  label_names_path: "outputs/xlm_r/label_names.json"
  log_dir: "outputs/xlm_r/logs"

wandb:
  enabled: true
  project: "elcardiocc-2026"
  entity: "elcardiocc26"
  run_name: null
  notes: "XLM-R Optimized Pipeline"
  tags: ["xlm-r", "mlc", "optimized"]
